# nginx serves the built React app and proxies /api to the HTTPS API container.
# Using one origin (http://localhost:8080) means the browser never has to trust the
# API's self-signed certificate and CORS is not needed in the containerised stack.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Security headers for the single-page app.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  location /api/ {
    proxy_pass https://api:5000;
    proxy_ssl_verify off;            # internal hop to the self-signed API certificate
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Single-page-app fallback: unknown paths are handled by React Router.
  location / {
    try_files $uri /index.html;
  }
}
