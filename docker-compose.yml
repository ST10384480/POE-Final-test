# HustleHub+ full stack: MongoDB + HTTPS API + nginx-served React client.
#   1. cp .env.example .env   (and set JWT_SECRET:  openssl rand -hex 32)
#   2. docker compose up --build
#   3. (first run only) seed demo data:  docker compose run --rm api npm run seed
#   4. open http://localhost:8080
name: hustlehub

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No ports published: the database is reachable only from other containers.

  api:
    build:
      context: ./hustlehub+part2 update/hustlehub-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/hustlehub
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ORIGIN: http://localhost:8080
      TRUST_PROXY: 1            # one reverse proxy (nginx) in front of the API
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES:-15}
      LOG_DIR: /app/logs
    volumes:
      - api-logs:/app/logs      # app.log, security.log, access.log survive restarts
    ports:
      - "127.0.0.1:5000:5000"   # optional: direct access for Postman (localhost only)

  client:
    build:
      context: ./hustlehub+part2 update/hustlehub-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  mongo-data:
  api-logs:
